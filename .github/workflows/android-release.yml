name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Accept all SDK licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Create keystore directory
        run: mkdir -p android/keystore

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/vitality-compass.keystore

      - name: Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore/signing.properties << 'PROPS'
          storeFile=keystore/vitality-compass.keystore
          storePassword=KEYSTORE_PASSWORD_PLACEHOLDER
          keyAlias=KEY_ALIAS_PLACEHOLDER
          keyPassword=KEY_PASSWORD_PLACEHOLDER
          PROPS
          sed -i "s/KEYSTORE_PASSWORD_PLACEHOLDER/${KEYSTORE_PASSWORD}/" android/keystore/signing.properties
          sed -i "s/KEY_ALIAS_PLACEHOLDER/${KEY_ALIAS}/" android/keystore/signing.properties
          sed -i "s/KEY_PASSWORD_PLACEHOLDER/${KEY_PASSWORD}/" android/keystore/signing.properties

      - name: Build signed release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitality-compass-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
