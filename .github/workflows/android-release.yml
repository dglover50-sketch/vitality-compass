name: Android Build
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build
      - run: npx cap copy android

      - run: mkdir -p android/keystore

      - env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/keystore/vitality-compass.keystore

      - env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore/signing.properties << 'PROPS'
          storeFile=keystore/vitality-compass.keystore
          storePassword=KEYSTORE_PASSWORD_PLACEHOLDER
          keyAlias=KEY_ALIAS_PLACEHOLDER
          keyPassword=KEY_PASSWORD_PLACEHOLDER
          PROPS
          sed -i "s/KEYSTORE_PASSWORD_PLACEHOLDER/${KEYSTORE_PASSWORD}/" android/keystore/signing.properties
          sed -i "s/KEY_ALIAS_PLACEHOLDER/${KEY_ALIAS}/" android/keystore/signing.properties
          sed -i "s/KEY_PASSWORD_PLACEHOLDER/${KEY_PASSWORD}/" android/keystore/signing.properties

      - run: cd android && chmod +x ./gradlew && ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: vitality-compass-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
