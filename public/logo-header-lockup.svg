<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" fill="none">
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D8A85"/>
      <stop offset="100%" stop-color="#0A6E6A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#3D8B6A"/>
    </linearGradient>
  </defs>

  <!-- Logo mark: simplified compass + leaf -->
  <g transform="translate(20, 100)">
    <!-- Compass circle -->
    <circle cx="0" cy="0" r="72" stroke="url(#tealGrad)" stroke-width="6" fill="none"/>
    <!-- Compass cross -->
    <line x1="0" y1="-55" x2="0" y2="55" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- North arrow -->
    <polygon points="0,-66 -8,-48 8,-48" fill="#0A6E6A"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="#E8A838"/>
    <!-- Leaf going up-right -->
    <g transform="rotate(-35)">
      <line x1="0" y1="0" x2="30" y2="-30" stroke="url(#leafGrad)" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,0 C6,-9 14,-18 18,-26 C22,-34 28,-36 30,-30 C26,-24 20,-18 14,-12 C8,-6 4,-3 0,0Z" fill="url(#leafGrad)"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="110" y="108" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="52" font-weight="700" fill="#1A1A18" letter-spacing="-0.5">Vitality</text>
  <text x="110" y="165" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="52" font-weight="700" fill="#0A6E6A" letter-spacing="-0.5">Compass</text>

  <!-- Tagline -->
  <text x="110" y="190" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="400" fill="#8C8A85" letter-spacing="0.3">Science-backed wellness guidance</text>
</svg>