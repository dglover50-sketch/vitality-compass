<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D8A85"/>
      <stop offset="100%" stop-color="#0A6E6A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#3D8B6A"/>
    </linearGradient>
  </defs>

  <!-- Outer compass ring -->
  <circle cx="256" cy="256" r="240" stroke="url(#tealGrad)" stroke-width="24" fill="none"/>

  <!-- Inner ring detail -->
  <circle cx="256" cy="256" r="210" stroke="#0A6E6A" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Compass cross - North/South -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Compass cross - East/West -->
  <line x1="56" y1="256" x2="456" y2="256" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- North arrow head -->
  <polygon points="256,36 240,96 272,96" fill="#0A6E6A"/>
  <!-- South arrow head -->
  <polygon points="256,476 240,416 272,416" fill="#0D8A85"/>
  <!-- East arrow head -->
  <polygon points="476,256 416,240 416,272" fill="#0D8A85"/>
  <!-- West arrow head -->
  <polygon points="36,256 96,240 96,272" fill="#0D8A85"/>

  <!-- Compass circle center point -->
  <circle cx="256" cy="256" r="12" fill="#E8A838"/>

  <!-- N S E W labels -->
  <text x="256" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#0A6E6A">N</text>
  <text x="256" y="502" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#0D8A85">S</text>
  <text x="504" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#0D8A85">E</text>
  <text x="8" y="262" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#0D8A85">W</text>

  <!-- Leaf sprouting from center, growing diagonally up-right -->
  <g transform="translate(256,256) rotate(-30)">
    <!-- Stem -->
    <line x1="0" y1="0" x2="100" y2="-100" stroke="url(#leafGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Leaf left half -->
    <path d="M0,0 C20,-30 40,-50 50,-70 C60,-90 80,-100 100,-100 C80,-80 60,-60 50,-40 C40,-20 20,-10 0,0Z" fill="url(#leafGrad)" opacity="0.9"/>
    <!-- Leaf vein -->
    <path d="M0,0 L100,-100" stroke="#2D6A4F" stroke-width="1.5" opacity="0.4"/>
    <!-- Side veins -->
    <line x1="30" y1="-30" x2="45" y2="-25" stroke="#2D6A4F" stroke-width="1" opacity="0.3"/>
    <line x1="55" y1="-55" x2="70" y2="-50" stroke="#2D6A4F" stroke-width="1" opacity="0.3"/>
    <line x1="80" y1="-80" x2="90" y2="-75" stroke="#2D6A4F" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Warm accent dots on cardinal points -->
  <circle cx="256" cy="80" r="6" fill="#E8A838"/>
  <circle cx="256" cy="432" r="6" fill="#E8A838"/>
  <circle cx="80" cy="256" r="6" fill="#E8A838"/>
  <circle cx="432" cy="256" r="6" fill="#E8A838"/>
</svg>